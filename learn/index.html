<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Playground · cite.inator</title><link rel="stylesheet" href="./learning.css"><link rel="stylesheet" href="./assets/citation-inspector.css"></head>
<body><header><a class="brand" href="./about.html" id="brand">cite.inator</a><nav aria-label="Learning"><a href="./">Playground</a><a href="./import/">Import</a><a href="./guide.html">Guide</a></nav><a class="github-link" href="https://github.com/randal-cox/cite.inator"><span>GitHub</span><span id="version"></span></a></header>
<main id="playground"><h1>Playground</h1><div class="playground-layout">
<section class="examples" aria-label="Examples"><h2 class="gallery-heading">Examples</h2><div id="example-gallery" class="example-gallery"></div></section>
<section class="example-detail"><h2 id="example-title" class="example-title"></h2><div class="controls" role="group" aria-label="Example controls"><div class="control-group"><label><input id="hover" type="checkbox" checked> Hover</label><span class="help-wrap"><button type="button" aria-label="Hover configuration" aria-describedby="hover-help">?</button><code role="tooltip" id="hover-help"></code></span></div><div class="control-group"><label>CSS <select id="appearance"><option value="paper">Paper</option><option value="ink">Ink</option><option value="compact">Compact</option></select></label><span class="help-wrap"><button type="button" aria-label="CSS configuration" aria-describedby="css-help">?</button><code role="tooltip" id="css-help"></code></span></div><div class="control-group"><label>Style <select id="style"><option value="chicago-author-date">Chicago</option><option value="apa">APA</option><option value="mla">MLA</option><option value="harvard">Harvard</option><option value="vancouver">Vancouver</option></select></label><span class="help-wrap"><button type="button" aria-label="Citation style configuration" aria-describedby="style-help">?</button><code role="tooltip" id="style-help"></code></span></div><button id="reset" type="button">Reset</button></div>
<p id="lesson"></p><p id="error" role="status" hidden></p>
<div class="workbench"><details class="source" id="source-panel" open><summary>Source</summary><textarea id="source" aria-label="Source" spellcheck="false"></textarea></details><details class="result" id="result-panel" open><summary>Result</summary><div id="result"></div></details></div>
<div class="workbench code-workbench"><details id="javascript-panel"><summary>JavaScript</summary><pre><code id="initialization"></code></pre></details><details id="html-panel"><summary>HTML</summary><pre id="compiled"></pre></details>
</div>
<div class="downloads"><div class="bibliography-download"><label for="bibliography-format">Bibliography</label><select id="bibliography-format"><option value="csl-json">CSL-JSON</option><option value="bibtex">BibTeX</option><option value="ris">RIS</option></select><button class="download-button" id="download-bibliography" type="button" disabled><span aria-hidden="true">↓</span>Download bibliography</button></div><button class="download-button" id="download-source" type="button" disabled><span aria-hidden="true">↓</span>Download Markdown</button><button class="download-button" id="download-cache" type="button" disabled><span aria-hidden="true">↓</span>Download reference cache</button><a class="download-button" href="./citation-starter.zip" download><span aria-hidden="true">↓</span>Copied-file starter</a><a class="download-button" href="./citation-npm-starter.zip" download><span aria-hidden="true">↓</span>npm starter</a><a class="download-button" href="./citation-learning-site.zip" download><span aria-hidden="true">↓</span>Offline learning site</a></div>
<p id="export-status" role="status" hidden></p>
<details id="metadata-panel"><summary>Advanced: reference metadata</summary><textarea id="records" aria-label="Reference metadata JSON" spellcheck="false"></textarea></details><details id="configuration-panel"><summary>Configuration (JSON)</summary><textarea id="configuration" aria-label="Configuration JSON" spellcheck="false"></textarea></details><details id="diagnostics-panel"><summary>Diagnostics</summary><pre id="diagnostics"></pre></details>
</section></div></main><footer>Randal Cox · <a href="https://orcid.org/0009-0002-3427-7190">ORCID</a> · <a href="https://github.com/randal-cox/cite.inator/blob/main/LICENSE">MIT license</a></footer><script type="module" src="./learning.mjs"></script></body></html>
